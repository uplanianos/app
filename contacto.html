<!DOCTYPE html>
<meta charset="utf-8">
<html lang="en-US">
<html>
<head>
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <link rel="icon" href="media/uplanianos-icon.png">
 <link rel="stylesheet" href="files/attend-style.css">
 <title>Uplanianos - Contacto!</title>
</head>


<body>

<div class="titleDiv"><!-- RESET CLICKABLE ELEMENTS -->
 <br>
 Se agradecen tus comentarios, consultas y sugerencias!
 </div>

 <div class="rollDiv">
 <form id="contactForm">
 <br>
 Tus datos: &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
 <input type="text" class="theInputs" id="People" name="People" placeholder="* ¿Nombre, Apellido / Apodo?" style="text-transform: none;"><br><br>

 Contacto: &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
 <input type="text" class="theInputs" id="Contact" name="Contact" placeholder="* ¿Correo, Insta, WhatsApp?" style="text-transform: none;"><br><br>

 Comentarios: &nbsp;
 <textarea class="theInputs" id="Comment" name="Comment" placeholder="¿Tienes algún comentario?" style="text-transform: none; resize: none;"></textarea>
 <br><br>

 Sugerencias: &nbsp;&nbsp;
 <textarea class="theInputs" id="Suggest" name="Suggest" placeholder="¿Ideas, sugerencias, mejoras?" style="text-transform: none; resize: none;"></textarea>
 <br><br>

 Consultas: &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
 <textarea class="theInputs" id="Doubts" name="Doubts" placeholder="¿Tienes alguna consulta?" style="text-transform: none; resize: none;"></textarea>
 <br><br>

 <div style="display: flex-grid; align-items: center; text-align: center; padding-left: 6%;">
 <div class="message" id="message" style="display: none; margin: auto; width: 75%;"></div>
 <button class="theButtons" type="submit" id="submitButton" style="background: gray; cursor: not-allowed;" DISABLED>🗣️ ENVIAR 💭</button>
 <button class="theButtons"  type="reset" id="deleteButton" style="background: red;" onclick="doDelete()">⚠️BORRAR!⚠️</button>
 </div>

 </div>
 </form>
 </div>
 <br><br><br>
 <br><br><br>
</body>



<!- SAVE FUNCTION ->
<script type="text/javascript">
// ==============================
// LOCAL STORAGE - SAVE FUNCTION!
// ==============================
window.onbeforeunload = function() {
if (typeof(Storage) !== "undefined") { saveData() }
}

function saveData() {
 localStorage.People = document.getElementById("People").value
 localStorage.Contact = document.getElementById("Contact").value
 localStorage.Comment = document.getElementById("Comment").value
 localStorage.Suggest = document.getElementById("Suggest").value
 localStorage.Doubts = document.getElementById("Doubts").value
}
// END OF "BEFORE LOAD"

window.onload = function() {
// LOAD DATA!
loadData()
saveInput()
checkInput()

function loadData() {
 document.getElementById("People").value = localStorage.People || ""
 document.getElementById("Contact").value = localStorage.Contact || ""
 document.getElementById("Comment").value = localStorage.Comment || ""
 document.getElementById("Suggest").value = localStorage.Suggest || ""
 document.getElementById("Doubts").value = localStorage.Doubts || ""
 }

// END OF ONLOAD
}
</script>


<script type="text/javascript">
// =========================
// SUBMIT FORM FUNCTION
// =========================
const form = document.getElementById("contactForm");
const submitButton = document.getElementById("submitButton");
const messageDiv = document.getElementById("message");

form.addEventListener("submit", async function (e) {
  e.preventDefault();
  
  // DISABLE BUTTON
  submitButton.disabled = true;

  // DISPLAYING MESSAGE
  message.textContent = "Enviando...";
  messageDiv.style.display = "block";
  messageDiv.style.backgroundColor = "beige";
  messageDiv.style.color = "cornflowerblue";

  try {
    const formData = new FormData(this);
    const formDataObj = {};

    // Convert FormData to object
    for (let [key, value] of formData.entries()) { formDataObj[key] = value; }

    // Submit form data
    const scriptURL = "https://script.google.com/macros/s/AKfycbx9u1TVzj5sCl4QWbDCB3AXs9FQs4zlBGooDyvW8uXLZ6OemUuqXDzkMjdDc0p0v3v1fQ/exec";

    const response = await fetch(scriptURL, {
        redirect: "follow",
        method: "POST",
        body: JSON.stringify(formDataObj),
        headers: { "Content-Type": "text/plain;charset=utf-8", },
        });

    const data = await response.json();

    if (data.status === "success") {
        messageDiv.textContent = data.message || "Gracias por tu contacto... trataremos de responder!";
        messageDiv.style.backgroundColor = "#48c78e";
        messageDiv.style.color = "white";
        form.reset();
        } else { throw new Error(data.message || "Problema encontrado... intenta más tarde!"); }
    } catch (error) {
        console.error("Error:", error);
        messageDiv.textContent = "Error: " + error.message;
        messageDiv.style.backgroundColor = "#f14668";
        messageDiv.style.color = "white";
        }

    finally {
	// RE-ENABLE BUTTON
	// submitButton.disabled = false;
	submitButton.style.background = "gray"; 
	submitButton.style.cursor = "not-allowed";

    setTimeout(() => {
        messageDiv.textContent = "";
        messageDiv.style.display = "none";
        }, 5000);
    }
})



// =========================
// SAVE INPUT FUNCTION!
// =========================
function saveInput() {
// SAVING INPUT EDITS!
let userInput = document.querySelectorAll("input")
for(let inputChange of userInput) {
 inputChange.addEventListener("change", function() { saveData(); checkInput() })
 }
let textInput = document.querySelectorAll("textarea")
for(let textChange of textInput) {
 textChange.addEventListener("change", function() { saveData(); checkInput() })
 }
}


// =========================
// CHECK INPUT FUNCTION!
// =========================
function checkInput() {
// CHECKING INPUT
let People = document.getElementById("People")
let Contact = document.getElementById("Contact")
let Comment = document.getElementById("Comment")
let Suggest = document.getElementById("Suggest")
let Doubts = document.getElementById("Doubts")
if (People.value.length >= 4 && Contact.value.length >= 4) {
 if (Comment.value !== "" || Suggest.value !== "" || Doubts.value !== "") {
  submitButton.style.background = "green"
  submitButton.style.cursor = "pointer"
  submitButton.disabled = false
  }
 else { submitButton.style.background = "gray"; submitButton.style.cursor = "not-allowed"; submitButton.disabled = true }
 }
else { submitButton.style.background = "gray"; submitButton.style.cursor = "not-allowed"; submitButton.disabled = true }
}



// =========================
// DELETE BUTTON FUNCTION
// =========================
function doDelete() {
let deleteButton = document.getElementById("deleteButton")
deleteButton.innerText = "LISTO ✔️"
submitButton.disabled = true
submitButton.style.background = "gray";
setTimeout(() => { deleteButton.innerText = "⚠️BORRAR!⚠️" }, 1200)
}



// ======================
// END OF JAVASCRIPT CODE!!
</script>


</html>
